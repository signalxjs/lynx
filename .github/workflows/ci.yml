name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Node 20 dropped (#957, agreed; executed here with #951): the
        # @lynx-js/tasm WASM encoder that template-webpack-plugin >= 0.11.1
        # ships needs a newer V8 ("Unknown heap type -14" on the web build).
        node-version: ['22', '24']
        include:
          - os: windows-latest
            node-version: '22'
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lockstep version check
        run: pnpm version:check

      - name: Lint
        run: pnpm lint

      # Every core dep must flow through a single-minor catalog (one hoisted
      # copy of @sigx/reactivity). Cheap static check; fails fast before build/test.
      - name: Verify catalog
        run: pnpm verify:catalog

      # Module API contract (CONVENTIONS.md C1-C12) and native method-name
      # agreement across JS / manifest / Swift / Kotlin. Both are ratchets
      # against a baseline of pre-existing violations owned by epic #857:
      # new drift fails, and a baseline entry that is no longer needed fails
      # too, so the baselines shrink as module audits land.
      - name: Module conventions
        run: pnpm check:conventions

      - name: Module manifests
        run: pnpm check:manifests

      # Build before typecheck — workspace packages publish types via dist/
      # and cross-package type resolution at the root tsconfig follows the
      # types field. Without dist/ present, subpath imports (e.g.
      # '@sigx/lynx-runtime-main/install-hybrid-worklet') and triple-slash
      # `<reference types="@sigx/lynx-runtime" />` fail to resolve.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
